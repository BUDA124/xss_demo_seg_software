<!DOCTYPE html>
<html>
<head>
    <title>Stored XSS Demo - Comments</title>
</head>
<body>

<h2>Hi, {{ username }} 👋</h2>
<h3>Comments (Stored XSS Demo)</h3>

<form method="POST">
    <textarea name="comment" rows="4" cols="40" placeholder="Write a comment"></textarea><br><br>
    <button type="submit">Post Comment</button>
</form>

<hr>

{% for c in comments %}
    <!-- ❌ VULNERABLE: rendering unescaped user input -->
    <p>{{ c|safe }}</p>
    <hr>
{% endfor %}

<p><a href="/home">Back to Home</a></p>

</body>
</html>
